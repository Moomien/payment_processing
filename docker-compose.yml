services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres_bd
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
