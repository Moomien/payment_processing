services:
  postgres:
    image: postgres:16
    container_name: postgres_bd
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis_bd
    command: redis-server --user ${REDIS_USER} on >${REDIS_PASSWORD} ~* +@all
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:
  redis_data:
  kafka_data:
