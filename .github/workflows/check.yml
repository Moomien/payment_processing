name: Check
on: [push, pull_request]
jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - name: install deps
        run: go mod download
      - name: Lint
        run: go vet ./...
  test:
    needs: [golangci-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ['1.25.12']
        os: ['ubuntu-latest', 'windows-latest']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup GO
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: install deps
        run: go mod download
      - name: Run tests
        run: go test ./internal/... -coverprofile=coverage.out
      - name: Check coverage threshold
        if: runner.os == 'Linux'
        run: |
            COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
            echo "Coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < 25" | bc -l) )); then
              echo "Coverage is below 25%"
              exit 1
            fi

  e2e:
    needs: [golangci-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
      - name: Run e2e tests
        run: go test -count=1 ./e2e/...
